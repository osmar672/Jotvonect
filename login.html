<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión de JobConnect">
  <title>JobConnect | Iniciar sesión</title>
  <link rel="stylesheet" href="src/css/base.css">
  <link rel="stylesheet" href="src/css/auth.css">
</head>
<body class="auth-page">
  <main id="login-root" class="auth-page__main">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-card__brand">
        <span class="auth-card__mark" aria-hidden="true">J</span>
        <div>
          <strong>JobConnect</strong>
          <span>Gestión de empleabilidad</span>
        </div>
      </div>

      <header class="auth-card__header">
        <p class="auth-card__eyebrow">Acceso seguro</p>
        <h1 id="login-title">Iniciar sesión</h1>
        <p>Ingresa tus credenciales para acceder al panel de JobConnect.</p>
      </header>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 required aria-required="true" placeholder="Usuario">
          <small class="field-error" data-error-for="username"></small>
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 required aria-required="true" placeholder="Contraseña">
          <small class="field-error" data-error-for="password"></small>
        </div>

        <div id="login-message" class="auth-message" role="alert" hidden></div>

        <button id="login-submit" class="auth-submit" type="submit">
          <span class="auth-submit__label">Entrar</span>
          <span class="auth-submit__loading" hidden>Iniciando sesión…</span>
        </button>
      </form>

      <p class="auth-card__footer">JobConnect · Plataforma de empleabilidad</p>
    </section>
  </main>

  <script type="module" src="src/js/auth/login-page.js"></script>
</body>
</html>
